<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestión de Tareas Universitarias</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        .completada {
            text-decoration: line-through;
            color: gray;
        }
    </style>
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">
                    <h1 class="h3 mb-0">
                        Gestor de Tareas Universitarias
                    </h1>
                </div>

                <div class="card-body">

                    <!-- Mensajes -->
                    <div id="alertas"></div>

                    <!-- Formulario -->
                    <form id="todo-form" class="mb-4">

                        <div class="mb-3">
                            <label for="titulo" class="form-label">
                                Título de la tarea
                            </label>

                            <input
                                type="text"
                                id="titulo"
                                class="form-control"
                                placeholder="Ingrese el título de la tarea"
                            >
                        </div>

                        <div class="mb-3">
                            <label for="curso" class="form-label">
                                Curso
                            </label>

                            <input
                                type="text"
                                id="curso"
                                class="form-control"
                                placeholder="Ingrese el curso"
                            >
                        </div>

                        <div class="mb-3">
                            <label for="fechaEntrega" class="form-label">
                                Fecha de entrega
                            </label>

                            <input
                                type="date"
                                id="fechaEntrega"
                                class="form-control"
                            >
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary">
                            Agregar tarea
                        </button>

                    </form>

                    <!-- Filtros -->
                    <div class="mb-4">
                        <h2 class="h5 mb-3">
                            Filtrar tareas
                        </h2>

                        <button
                            class="btn btn-secondary btn-sm"
                            onclick="cambiarFiltro('todas')">
                            Todas
                        </button>

                        <button
                            class="btn btn-warning btn-sm"
                            onclick="cambiarFiltro('pendientes')">
                            Pendientes
                        </button>

                        <button
                            class="btn btn-success btn-sm"
                            onclick="cambiarFiltro('completadas')">
                            Completadas
                        </button>
                    </div>

                    <!-- Lista -->
                    <h2 class="h5 mb-3">
                        Lista de tareas
                    </h2>

                    <ul
                        id="todo-list"
                        class="list-group">
                    </ul>

                </div>

            </div>

        </div>
    </div>

</div>

<script src="app.js"></script>

</body>
</html>
